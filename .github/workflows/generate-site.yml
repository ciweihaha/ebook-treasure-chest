name: Generate Index

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "md/**"
  # PR 时只验证生成步骤（checkout/setup-python/Python 版本与生成脚本），
  # Commit and push 步骤仅在 push 时执行，不向 main 推送
  pull_request:
    branches:
      - main
    paths:
      - "scripts/**"
      - "md/**"
      - ".github/workflows/generate-site.yml"
  # 手动触发：用于在分支上验证升级后的 Action / Python 版本（不推送）
  workflow_dispatch:
  # 排除由同步脚本触发的提交（避免循环）
  # 同步脚本使用 [skip ci] 标记，不会触发此工作流

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 审计修复 GH-E2：钉完整 SHA，避免可变 tag 被移动后注入代码
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # 获取完整历史，避免推送冲突

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          echo "No external dependencies required"

      - name: Parse MD files to JSON
        # 注意：all-books.json 通常已由同步脚本生成
        # 这里确保all-books.json存在（如果不存在则生成）
        run: |
          if [ ! -f "docs/all-books.json" ]; then
            echo "⚠️  all-books.json 不存在，生成中..."
            python scripts/parse_md_to_json.py
          else
            echo "✅ all-books.json 已存在（可能由同步脚本生成），跳过生成"
          fi

      - name: Generate index.html
        run: |
          python scripts/generate_index.py

      - name: Commit and push
        # 仅 push 到 main 时提交回推；PR 运行时跳过，避免向 main 推送
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/books.json docs/all-books.json docs/parse-stats.json docs/search.js
          git rm docs/index.md 2>/dev/null || true
          git commit -m "auto: update index and search data" || echo "No changes"
          
          # 在推送前先拉取远程更改（避免推送冲突）
          echo "📥 拉取远程最新更改..."
          git fetch origin main
          git pull origin main --rebase || git pull origin main --no-rebase || true
          
          # 推送更改（最多重试3次）
          max_retries=3
          retry_count=0
          while [ $retry_count -lt $max_retries ]; do
            if git push origin main; then
              echo "✅ 推送成功"
              break
            else
              retry_count=$((retry_count + 1))
              echo "⚠️  推送失败，重试 $retry_count/$max_retries..."
              if [ $retry_count -lt $max_retries ]; then
                # 重新拉取并合并
                git fetch origin main
                git rebase origin/main || git merge origin/main || true
                sleep 2
              else
                echo "❌ 推送失败，已达到最大重试次数"
                exit 1
              fi
            fi
          done
